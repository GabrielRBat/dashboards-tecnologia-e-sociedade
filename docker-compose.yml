services:
  db:
    image: postgres:16-alpine
    container_name: argamassas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: argamassas
    # A porta do host é configurável pelo .env (DB_PORT), porque é comum já
    # existir outro PostgreSQL na 5432 na máquina de quem desenvolve.
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - argamassas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d argamassas']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  argamassas-db-data:
